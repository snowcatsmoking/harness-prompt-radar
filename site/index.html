<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>harness-prompt-radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>harness-prompt-radar</h1>
  <p>持续追踪主流 AI Agent Harness(Claude Code、Codex CLI、Kimi Code CLI、OpenCode)的 system prompt,记录版本演变。</p>
  <p>数据项目,不做解读——每个 harness 当前版本的完整 system prompt 原文见下。</p>
  <nav class="site-nav">
    <a href="#prompts">全文</a>
    <a href="#summary">概览</a>
  </nav>
</header>
<main>

  <section id="prompts">
    <h2 class="section-title">当前版本 System Prompt 全文</h2>
    <p class="section-note">按版本抓取时间排序。每个 harness 的历史版本与 diff 见对应详情页。</p>
    <div id="prompt-list"></div>
  </section>

  <section id="summary">
    <h2 class="section-title">概览</h2>
    <table class="harness-table" id="summary-table">
      <thead>
        <tr><th>Harness</th><th>版本</th><th>历史记录数</th><th>Token 数</th></tr>
      </thead>
      <tbody id="summary-body"></tbody>
    </table>
  </section>

</main>
<footer>
  数据来源见各 harness 详情页。<a href="https://github.com/snowcatsmoking/harness-prompt-radar">GitHub</a>
</footer>
<script src="markdown.js"></script>
<script>
const HARNESS_LABEL = {
  "claude-code": "Claude Code",
  "codex-cli": "Codex CLI",
  "kimi-code": "Kimi Code CLI",
  "opencode": "OpenCode",
};

async function main() {
  const manifest = await (await fetch('../data/manifest.json')).json();
  const status = await (await fetch('../data/status.json')).json().catch(() => ({}));
  const maxTokens = Math.max(...manifest.map(m => m.latest_token_count), 1);

  // full prompt texts
  const promptList = document.getElementById('prompt-list');
  for (const m of manifest) {
    const records = await (await fetch(`../data/${m.harness}.json`)).json();
    const latest = records[records.length - 1];
    const label = HARNESS_LABEL[m.harness] || m.harness;

    const block = document.createElement('article');
    block.className = 'prompt-block';
    block.id = m.harness;
    block.innerHTML = `
      <div class="prompt-block-header">
        <h3>${label}</h3>
        <span class="prompt-block-meta">
          v${latest.version} · ${latest.system_prompt_token_count.toLocaleString()} tokens ·
          <a href="${latest.source_url}">来源</a> ·
          <a href="detail.html?h=${m.harness}">版本历史</a>
        </span>
      </div>
      <div class="prompt-toc" style="display:none">
        <p class="prompt-toc-title">目录</p>
        <ul></ul>
      </div>
      <div class="prompt-text"></div>
    `;

    const textEl = block.querySelector('.prompt-text');
    const headers = renderMarkdown(latest.system_prompt, textEl);

    if (headers.length >= 2) {
      const tocEl = block.querySelector('.prompt-toc');
      const tocList = tocEl.querySelector('ul');
      for (const h of headers) {
        const li = document.createElement('li');
        if (h.level >= 2) li.className = 'toc-level-2';
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.text;
        li.appendChild(a);
        tocList.appendChild(li);
      }
      tocEl.style.display = '';
    }

    promptList.appendChild(block);
  }

  // summary table
  const body = document.getElementById('summary-body');
  for (const m of manifest) {
    const st = status[m.harness];
    const label = HARNESS_LABEL[m.harness] || m.harness;
    const pct = Math.round((m.latest_token_count / maxTokens) * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="harness-link" href="#${m.harness}">${label}</a></td>
      <td>v${m.latest_version}</td>
      <td>${m.version_count}</td>
      <td>
        ${m.latest_token_count.toLocaleString()}
        <div class="token-bar-track"><div class="token-bar-fill" style="width:${pct}%"></div></div>
        ${st && st.ok === false ? '<span class="tag tag-fail">抓取失败</span>' : ''}
      </td>
    `;
    body.appendChild(tr);
  }
}
main();
</script>
</body>
</html>
