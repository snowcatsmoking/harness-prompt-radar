<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Harness 详情 — harness-prompt-radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title">Harness</h1>
  <nav class="site-nav">
    <a href="index.html">全部 Harness</a>
  </nav>
</header>
<main>
  <section>
    <h2 class="section-title">版本历史</h2>
    <ul class="version-list" id="version-list"></ul>
  </section>

  <section>
    <h2 class="section-title">版本对比</h2>
    <div class="diff-controls">
      <label>从 <select id="from-select"></select></label>
      <label>到 <select id="to-select"></select></label>
    </div>
    <div id="diff-container"></div>
  </section>
</main>
<footer>
  <a href="index.html">&larr; 返回首页</a>
</footer>
<script src="diff.js"></script>
<script>
const HARNESS_LABEL = {
  "claude-code": "Claude Code",
  "codex-cli": "Codex CLI",
  "kimi-code": "Kimi Code CLI",
  "opencode": "OpenCode",
};

function harnessFromQuery() {
  const params = new URLSearchParams(location.search);
  return params.get('h') || '';
}

async function main() {
  const harness = harnessFromQuery();
  const label = HARNESS_LABEL[harness] || harness;
  document.getElementById('title').textContent = label;
  document.title = label + ' — harness-prompt-radar';

  const records = await (await fetch(`../data/${harness}.json`)).json();
  if (!records.length) {
    document.getElementById('version-list').innerHTML = '<li>暂无数据</li>';
    return;
  }

  const versionListEl = document.getElementById('version-list');
  for (const r of [...records].reverse()) {
    const li = document.createElement('li');
    li.innerHTML = `
      <span>v${r.version} <span style="color:var(--text-dim)">${r.extracted_at}</span></span>
      <span>${r.system_prompt_token_count.toLocaleString()} tokens
        <span class="tag ${r.extraction_confidence === 'high' ? 'tag-high' : 'tag-low'}">${r.extraction_confidence === 'high' ? '高' : '低'}</span>
      </span>
    `;
    versionListEl.appendChild(li);
  }

  const fromSelect = document.getElementById('from-select');
  const toSelect = document.getElementById('to-select');
  for (const r of records) {
    const optFrom = document.createElement('option');
    optFrom.value = r.version;
    optFrom.textContent = 'v' + r.version;
    fromSelect.appendChild(optFrom);

    const optTo = document.createElement('option');
    optTo.value = r.version;
    optTo.textContent = 'v' + r.version;
    toSelect.appendChild(optTo);
  }
  fromSelect.selectedIndex = 0;
  toSelect.selectedIndex = records.length - 1;

  function renderCurrentDiff() {
    const fromRecord = records.find(r => r.version === fromSelect.value);
    const toRecord = records.find(r => r.version === toSelect.value);
    const container = document.getElementById('diff-container');
    container.innerHTML = '';
    if (!fromRecord || !toRecord) return;
    if (fromRecord.version === toRecord.version) {
      container.innerHTML = '<p style="color:var(--text-dim); font-size:0.88rem">选择两个不同版本以查看 diff。</p>';
      return;
    }
    container.appendChild(renderDiff(fromRecord.system_prompt, toRecord.system_prompt));
  }

  fromSelect.addEventListener('change', renderCurrentDiff);
  toSelect.addEventListener('change', renderCurrentDiff);
  renderCurrentDiff();
}
main();
</script>
</body>
</html>
